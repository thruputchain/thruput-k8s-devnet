# Post-deploy check. Re-applying after the TTL expires runs it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: thruput-smoke
  labels:
    app.kubernetes.io/part-of: thruput
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: thruput
    spec:
      restartPolicy: OnFailure
      # Optional: create it when the registry needs credentials (see README).
      imagePullSecrets:
        - name: thruput-registry
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: smoke
          image: thruput-validator
          command: ["/bin/bash", "/opt/thruput/scripts/smoke.sh"]
          envFrom:
            - configMapRef:
                name: thruput-settings
          volumeMounts:
            - name: scripts
              mountPath: /opt/thruput/scripts
      volumes:
        - name: scripts
          configMap:
            name: thruput-scripts
