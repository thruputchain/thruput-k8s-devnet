  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    thruput.network/hog-auth: "true"
  ports:
    - name: db
      port: 8050
      targetPort: 8050
    - name: mempool
      port: 8051
      targetPort: 8051
