# One Service per daemon. Each selects whichever pod hosts that daemon, so
# peers address each other the same way in every topology. Addresses are
# published before readiness because a pod is only Ready once every daemon in
# it is, while those daemons wait on each other through these Services.
---
apiVersion: v1
kind: Service
metadata:
  name: hog-mempool
  labels:
    app.kubernetes.io/part-of: thruput
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    thruput.network/hog-mempool: "true"
  ports:
    - name: coordinator
      port: 8070
      targetPort: 8070
    - name: executor
      port: 8071
      targetPort: 8071
    - name: db
      port: 8072
      targetPort: 8072
    - name: event
      port: 8073
      targetPort: 8073
    - name: auth
      port: 8074
      targetPort: 8074
    - name: gateway
      port: 8075
      targetPort: 8075
    - name: metrics
      port: 8076
      targetPort: 8076
---
apiVersion: v1
kind: Service
metadata:
  name: hog-db
  labels:
    app.kubernetes.io/part-of: thruput
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    thruput.network/hog-db: "true"
  ports:
    - name: executor
      port: 8080
      targetPort: 8080
    - name: mempool
      port: 8081
      targetPort: 8081
    - name: auth
      port: 8082
      targetPort: 8082
    - name: gateway
      port: 8084
      targetPort: 8084
---
apiVersion: v1
kind: Service
