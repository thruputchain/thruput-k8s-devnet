  name: hog-exec
  labels:
    app.kubernetes.io/part-of: thruput
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    thruput.network/hog-exec: "true"
  ports:
    - name: mempool
      port: 8040
      targetPort: 8040
    - name: metrics
      port: 8041
      targetPort: 8041
    - name: view-gateway
      port: 8042
      targetPort: 8042
---
apiVersion: v1
