# Shared objects for every Thruput k8s topology: namespace, settings, local
# development secrets, one Service per daemon, and the post-deploy smoke Job.
# Pods and containers come from ../pod and ../components through an overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - services.yaml
  - smoke-job.yaml

generatorOptions:
  labels:
    app.kubernetes.io/part-of: thruput

configMapGenerator:
  - name: thruput-settings
    envs:
      - settings.env
  - name: thruput-scripts
    files:
      - scripts/coordinator.sh
      - scripts/genesis.sh
      - scripts/gateway.sh
      - scripts/faucet.py
      - scripts/smoke.sh

secretGenerator:
  # Deterministic local-only keys. Replace both in an overlay for anything
  # reachable by people you do not trust.
  - name: thruput-faucet-key
    envs:
      - faucet-key.env
  - name: thruput-coordinator-config
    files:
      - chuckd.json
