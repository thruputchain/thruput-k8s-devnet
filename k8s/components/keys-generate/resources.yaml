apiVersion: v1
kind: ServiceAccount
metadata:
  name: thruput-keygen
  labels:
    app.kubernetes.io/part-of: thruput
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thruput-keygen
  labels:
    app.kubernetes.io/part-of: thruput
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [thruput-validator-key, thruput-faucet-key]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thruput-keygen
  labels:
    app.kubernetes.io/part-of: thruput
subjects:
  - kind: ServiceAccount
    name: thruput-keygen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: thruput-keygen
---
apiVersion: batch/v1
kind: Job
metadata:
  name: thruput-keygen
  labels:
    app.kubernetes.io/part-of: thruput
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: thruput
    spec:
      restartPolicy: OnFailure
      serviceAccountName: thruput-keygen
      imagePullSecrets:
        - name: thruput-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keygen
          image: thruput-validator
          command: [python3, /opt/thruput/scripts/keygen.py, ensure]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /opt/thruput/scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: thruput-scripts
