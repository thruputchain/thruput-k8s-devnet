apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hog-mempool
spec:
  selector:
    matchLabels:
      thruput.network/metrics-service: hog-mempool

  endpoints:
    - port: metrics
      path: /metrics
