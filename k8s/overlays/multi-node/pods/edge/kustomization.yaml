apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../pod

nameSuffix: -edge

labels:
  - pairs:
      thruput.network/pod: edge
    includeSelectors: true
    includeTemplates: true
  # Which daemon components add their containers to this pod.
  - pairs:
      thruput.network/hosts-hog-gateway: "true"
      thruput.network/hosts-hog-faucet: "true"

patches:
  # Schedule this pod onto nodes labelled for it:
  #   kubectl label node <node> thruput.network/node-role=edge
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          thruput.network/node-role: edge
