apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../pod

nameSuffix: -core

labels:
  - pairs:
      thruput.network/pod: core
    includeSelectors: true
    includeTemplates: true
  - pairs:
      thruput.network/hosts-hog-mempool: "true"
      thruput.network/hosts-hog-db: "true"
      thruput.network/hosts-hog-event: "true"
      thruput.network/hosts-hog-exec: "true"
      thruput.network/hosts-hog-auth: "true"
      thruput.network/hosts-hog-coordinator: "true"

patches:
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: thruput.network/pod
                        operator: In
                        values: [indexer, edge]
