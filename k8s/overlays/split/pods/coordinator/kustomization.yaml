apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../pod

nameSuffix: -coordinator

labels:
  - pairs:
      thruput.network/pod: coordinator
    includeSelectors: true
    includeTemplates: true
  # Which daemon components add their containers to this pod.
  - pairs:
      thruput.network/hosts-hog-coordinator: "true"
