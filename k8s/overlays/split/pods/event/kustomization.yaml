apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../pod

nameSuffix: -event

labels:
  - pairs:
      thruput.network/pod: event
    includeSelectors: true
    includeTemplates: true
  # Which daemon components add their containers to this pod.
  - pairs:
      thruput.network/hosts-hog-event: "true"
