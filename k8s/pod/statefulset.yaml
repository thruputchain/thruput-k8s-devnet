apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thruput
  labels:
    app.kubernetes.io/part-of: thruput
spec:
  replicas: 1
  serviceName: thruput
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/part-of: thruput
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: thruput
    spec:
      terminationGracePeriodSeconds: 30
      # Optional: create it when the registry needs credentials (see README).
      imagePullSecrets:
        - name: thruput-registry
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      initContainers:
        # Every daemon keeps its state under /data/<daemon> on the pod's volume.
        # Runs as root so any storage class works, and never uses fsGroup:
        # hog-event refuses an outbox directory with group permissions.
        - name: prepare-data
          image: thruput-validator
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              mkdir -p /data/hogdb /data/indexer /data/event /data/coordinator/bootstrap /data/coordinator/chuckd
              chown 999:999 /data /data/hogdb /data/indexer /data/event /data/coordinator /data/coordinator/bootstrap /data/coordinator/chuckd
              chmod 0700 /data/event
          volumeMounts:
            - name: data
              mountPath: /data
      containers: []
      volumes:
        - name: scripts
          configMap:
            name: thruput-scripts
        - name: coordinator-config
          secret:
            secretName: thruput-coordinator-config
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
