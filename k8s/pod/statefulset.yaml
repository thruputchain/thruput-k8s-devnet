apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thruput
  labels:
    app.kubernetes.io/part-of: thruput
spec:
  replicas: 1
  serviceName: thruput
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/part-of: thruput
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: thruput
    spec:
      terminationGracePeriodSeconds: 30
      # Optional: create it when the registry needs credentials (see README).
      imagePullSecrets:
        - name: thruput-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Every daemon keeps its state under /data/<daemon> on the pod's volume.
        # fsGroup grants volume access to UID 999; reset event permissions on every start
        # because fsGroup may add group bits that hog-event refuses.
        - name: prepare-data
          image: thruput-validator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              mkdir -p /data/hogdb /data/indexer /data/event /data/coordinator/bootstrap /data/coordinator/chuckd
              chmod 0700 /data/event
          volumeMounts:
            - name: data
              mountPath: /data
      containers: []
      volumes:
        - name: scripts
          configMap:
            name: thruput-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
